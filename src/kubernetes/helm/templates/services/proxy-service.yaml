{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.proxyService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.proxyService.name }}
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.proxyService.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Values.proxyService.name }}
    spec:
      containers:
      - name: {{ .Values.proxyService.name }}
        image: "{{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}"
        imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.proxyService.service.targetPort }}
        env:
        - name: PORT
          value: {{ .Values.proxyService.env.PORT | quote }}
        - name: DB_CONNECTION_STRING
          value: {{ .Values.proxyService.env.DB_CONNECTION_STRING | quote }}
        - name: GRADUAL_MIGRATION
          value: {{ .Values.proxyService.env.GRADUAL_MIGRATION | quote }}
        - name: MOVIES_MIGRATION_PERCENT
          value: {{ .Values.proxyService.env.MOVIES_MIGRATION_PERCENT | quote }}
        envFrom:
        - configMapRef:
            name: cinemaabyss-config
        - secretRef:
            name: cinemaabyss-secrets
        resources:
          {{- toYaml .Values.proxyService.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.proxyService.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.proxyService.service.targetPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.proxyService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.proxyService.name }}
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Values.proxyService.name }}
  ports:
  - port: {{ .Values.proxyService.service.port }}
    targetPort: {{ .Values.proxyService.service.targetPort }}
  type: {{ .Values.proxyService.service.type }}
{{- end }}